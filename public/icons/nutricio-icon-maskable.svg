<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="42%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="115%" r="85%">
      <stop offset="0%" stop-color="#022c22" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#022c22" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glossGrad" cx="50%" cy="-5%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbfdff"/>
      <stop offset="16%" stop-color="#e4eaf0"/>
      <stop offset="34%" stop-color="#93a2b3"/>
      <stop offset="50%" stop-color="#d8e0e8"/>
      <stop offset="66%" stop-color="#5c6b7d"/>
      <stop offset="84%" stop-color="#eef2f6"/>
      <stop offset="100%" stop-color="#3f4c5c"/>
    </linearGradient>

    <linearGradient id="letterShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Letter scaled ~14% smaller and recentred to stay inside the maskable safe zone -->
    <path id="letterN" d="
      M162,168 L216,168 L216,376 L162,376 Z
      M296,168 L350,168 L350,376 L296,376 Z
      M162,168 L216,168 L350,376 L296,376 Z
    "/>
    <clipPath id="letterClip">
      <use href="#letterN"/>
    </clipPath>

    <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Full-bleed background (no transparent corners, for maskable icons) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="512" height="512" fill="url(#vignette)"/>
  <rect x="0" y="0" width="512" height="512" fill="url(#glossGrad)"/>

  <ellipse cx="256" cy="90" rx="260" ry="120" fill="#ffffff" opacity="0.20" filter="url(#softBlur)"/>

  <use href="#letterN" x="0" y="7" fill="#022c22" opacity="0.45" filter="url(#softBlur)"/>
  <use href="#letterN" fill="url(#metalGrad)" stroke="#1e293b" stroke-opacity="0.25" stroke-width="1.5"/>

  <g clip-path="url(#letterClip)">
    <rect x="162" y="168" width="188" height="208" fill="url(#letterShine)"/>
    <ellipse cx="212" cy="208" rx="60" ry="34" fill="#ffffff" opacity="0.55" filter="url(#softBlur)"/>
  </g>

  <use href="#letterN" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
</svg>
