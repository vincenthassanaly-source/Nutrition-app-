<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="10%" y1="5%" x2="95%" y2="100%">
      <stop offset="0%" stop-color="#5A7A4E"/>
      <stop offset="30%" stop-color="#3D5A32"/>
      <stop offset="62%" stop-color="#2B4023"/>
      <stop offset="100%" stop-color="#111C10"/>
    </linearGradient>

    <radialGradient id="vignette" cx="72%" cy="90%" r="80%">
      <stop offset="0%" stop-color="#011a10" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#011a10" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glossStreak" x1="20%" y1="-5%" x2="65%" y2="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="metalGrad" cx="34%" cy="26%" r="85%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="18%" stop-color="#eef2f5"/>
      <stop offset="34%" stop-color="#aab6c2"/>
      <stop offset="48%" stop-color="#e4e9ed"/>
      <stop offset="64%" stop-color="#7c8896"/>
      <stop offset="80%" stop-color="#c3cbd2"/>
      <stop offset="100%" stop-color="#4a5561"/>
    </radialGradient>

    <radialGradient id="letterHighlight" cx="30%" cy="22%" r="38%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Letter scaled ~14% smaller and recentred to stay inside the maskable safe zone -->
    <path id="letterK" d="
      M162,168 L216,168 L216,376 L162,376 Z
      M216,272 L270,272 L350,168 L296,168 Z
      M216,272 L270,272 L350,376 L296,376 Z
    "/>
    <clipPath id="letterClip">
      <use href="#letterK"/>
    </clipPath>

    <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="tightBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Full-bleed background (no transparent corners, required for maskable icons) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="512" height="512" fill="url(#vignette)"/>
  <ellipse cx="340" cy="70" rx="200" ry="130" fill="url(#glossStreak)" transform="rotate(-18 340 70)"/>

  <use href="#letterK" fill="none" stroke="#02160e" stroke-width="6" stroke-opacity="0.55" filter="url(#tightBlur)"/>
  <use href="#letterK" x="0" y="6" fill="#011a10" opacity="0.4" filter="url(#softBlur)"/>
  <use href="#letterK" fill="url(#metalGrad)"/>

  <g clip-path="url(#letterClip)">
    <rect x="162" y="168" width="188" height="208" fill="url(#letterHighlight)"/>
  </g>

  <use href="#letterK" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
</svg>
